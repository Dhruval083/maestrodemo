# ================================================
# Maestro Web Test: Invalid Credentials
# ================================================
# Tests that an error message appears when
# logging in with wrong username/password.
#
# Run: maestro test .maestro/login-invalid-credentials.yaml
# ================================================

url: http://localhost:5173
---

# Launch the app
- launchApp

# Verify the Login page is loaded
- assertVisible: "Login"

# Enter wrong credentials
- tapOn:
    id: "username"
- inputText: "wronguser"

- tapOn:
    id: "password"
- inputText: "wrongpass"

# Submit
- tapOn: "Sign In"

# Verify error message is shown
- assertVisible: "Invalid username or password. Please try again."
